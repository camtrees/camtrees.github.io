<!-- CAM Trees shell; JavaScript builds its headings and rows from public JSON. -->
<section class="cam-table" data-cam-table data-source="{{ '/data/cam_trees.json' | relative_url }}">
  <!-- These controls act on all filtered records, not only the visible page. -->
  <div class="cam-table__controls">
    <label>
      Search all trees
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <button type="button" data-cam-table-print>Print filtered trees</button>
    <button type="button" data-cam-table-csv>Export as CSV</button>
    <button type="button" data-cam-table-map>Map filtered trees</button>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <!-- Scrollable region for the generated table and its sticky headings. -->
  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">CAM Trees</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- JavaScript adds Previous and Next buttons here when needed. -->
  <nav class="cam-table__pagination" aria-label="CAM TREES table pages" data-cam-table-pagination></nav>

  <!-- Settings consumed by cam-tables.js. Health is the default map theme; the
       Nuts Present theme includes only Some and Many. Keep this as valid JSON. -->
  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "csvFilename": "cam-trees.csv",
      "map": {
        "singular": "tree",
        "plural": "trees",
        "overlays": [
          {"label":"Hub Areas","url":"{{ '/data/hub-areas.geojson' | relative_url }}?v=20260828-warren-union-2"}
        ],
        "popupTitleKey": "site",
        "popupFields": [
          {"key":"tree_id","label":"Tree ID"},
          {"key":"latest_health","label":"Health"},
          {"key":"nuts_present","label":"Nuts Present"}
        ],
        "defaultTheme": "health",
        "themes": {
          "health": {
            "label": "Tree Health",
            "legendTitle": "Tree Health",
            "markerStyleKey": "latest_health",
            "defaultMarkerStyle": {"label":"Unknown","legendOrder":4,"order":-1,"color":"#555555","fillColor":"#8E8E8E"},
            "markerStyles": {
              "good": {"label":"Good","legendOrder":0,"order":0,"color":"#2f6b3a","fillColor":"#5eaa6c"},
              "dormant": {"label":"Dormant","legendOrder":1,"order":1,"color":"#245a8d","fillColor":"#4f9bd8"},
              "poor": {"label":"Poor","legendOrder":2,"order":2,"color":"#806800","fillColor":"#f2d64b"},
              "dead": {"label":"Dead","legendOrder":3,"order":3,"color":"#8b1e1e","fillColor":"#d94343"}
            }
          },
          "nuts": {
            "label": "Nuts Present",
            "legendTitle": "Nuts Present",
            "markerStyleKey": "nuts_present",
            "includeValues": ["some", "many"],
            "statusSuffix": "with Some or Many nuts present and valid coordinates mapped.",
            "defaultMarkerStyle": {"order":-1,"color":"#555555","fillColor":"#8E8E8E"},
            "markerStyles": {
              "some": {"label":"Some","legendOrder":0,"order":0,"color":"#8A5700","fillColor":"#E69F00"},
              "many": {"label":"Many","legendOrder":1,"order":1,"color":"#4A2A10","fillColor":"#7A4A21"}
            }
          }
        }
      },
      "columns": [
        {"key":"site","label":"Site","type":"text"},
        {"key":"tree_id","label":"Tree ID","type":"text"},
        {"key":"cam_org","label":"CAM Organization","type":"text"},
        {"key":"hub","label":"Hub","type":"text"},
        {"key":"date_planted_or_observed(wild)","label":"Date Planted / Observed","type":"date"},
        {"key":"planted_by","label":"Planted By","type":"text"},
        {"key":"primary_caretaker","label":"Primary Caretaker","type":"text"},
        {"key":"secondary_caretaker","label":"Secondary Caretaker","type":"text"},
        {"key":"latest_health","label":"Latest Health","type":"text","filter":"multi"},
        {"key":"latest_health_date","label":"Latest Health Date","type":"date"},
        {"key":"latest_height_in_inches","label":"Latest Height in Inches","type":"number"},
        {"key":"latest_height","label":"Latest Height","type":"text"},
        {"key":"latest_height_date","label":"Latest Height Date","type":"date"},
        {"key":"latest_water_date","label":"Latest Water Date","type":"date"},
        {"key":"nuts_present","label":"Nuts Present","type":"text"},
        {"key":"latest_nuts_date","label":"Latest Nuts Date","type":"date"},
        {"key":"longitude","label":"Longitude","type":"number"},
        {"key":"latitude","label":"Latitude","type":"number"},
        {"key":"elevation_in_feet","label":"Elevation","type":"number"},
        {"key":"access_path","label":"Access Path","type":"text"},
        {"key":"access_level","label":"Access Level","type":"text"},
        {"key":"access_method","label":"Access Method","type":"text"},
        {"key":"access_note","label":"Access Note","type":"text"},
        {"key":"form","label":"Form","type":"text"},
        {"key":"planting_method","label":"Planting Method","type":"text"},
        {"key":"wire_fence","label":"Wire Fence","type":"boolean"},
        {"key":"mother_tree","label":"Mother Tree","type":"text"},
        {"key":"mother_tree_other","label":"Mother Tree (Other)","type":"text"},
        {"key":"father_tree","label":"Father Tree","type":"text"},
        {"key":"father_tree_other","label":"Father Tree (Other)","type":"text"},
        {"key":"parent_tree_note","label":"Parent Tree Note","type":"text"},
        {"key":"note","label":"Note","type":"text"}
      ]
    }
  </script>
</section>
