<section class="cam-table" data-cam-table data-source="{{ '/data/cam_orgs.json' | relative_url }}">
  <div class="cam-table__controls">
    <label>
      Search all organizations
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <button type="button" data-cam-table-print>Print filtered organizations</button>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">CAM Organizations</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <nav class="cam-table__pagination" aria-label="CAM organizations table pages" data-cam-table-pagination></nav>

  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "columns": [
        {"key":"org_code","label":"Organization Code","type":"text"},
        {"key":"organization","label":"Organization","type":"text"},
        {"key":"contact","label":"Contact","type":"text"}
      ]
    }
  </script>
</section>
