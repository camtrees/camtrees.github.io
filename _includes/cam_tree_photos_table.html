<!-- CAM Tree Photos shell; JavaScript builds its headings and rows from public JSON. -->
<aside class="cam-table__notice" role="note">
  <p><strong>EpiCollect login required:</strong> Sign in to EpiCollect in this browser before selecting <strong>View Tree Photo</strong>. Otherwise, EpiCollect will display an authorization error instead of the photograph.</p>
</aside>

<section class="cam-table" data-cam-table data-source="{{ '/data/cam_tree_photos.json' | relative_url }}">
  <!-- This table intentionally provides search and CSV export, but no map,
       print, or column-chooser actions. -->
  <div class="cam-table__controls">
    <label>
      Search all tree photos
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <button type="button" data-cam-table-csv>Export as CSV</button>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <!-- The shared styling freezes View Record, Site, and Tree ID. -->
  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">CAM Tree Photos</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <nav class="cam-table__pagination" aria-label="CAM Tree Photos table pages" data-cam-table-pagination></nav>

  <!-- Keys match the quoted aliases in public_cam_tree_photos. The Site
       choices are populated from the complete downloaded dataset. -->
  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "csvFilename": "cam-tree-photos.csv",
      "columns": [
        {"key":"Site","label":"Site","type":"text","filter":"dialog-multi"},
        {"key":"Tree ID","label":"Tree ID","type":"text"},
        {"key":"Date","label":"Date","type":"date"},
        {"key":"Tag Photo","label":"Tag Photo","type":"text","filter":"multi"},
        {"key":"Photo URL","label":"Tree Photo","type":"url","linkLabel":"View Tree Photo","filter":false}
      ]
    }
  </script>
</section>

<!-- Shared assets; query values prevent stale browser caches. -->
<link rel="stylesheet" href="{{ '/assets/css/cam-tables.css' | relative_url }}?v=20261014-tree-photos-1">
<script defer src="{{ '/assets/js/cam-tables.js' | relative_url }}?v=20261013-parent-filter-2"></script>
