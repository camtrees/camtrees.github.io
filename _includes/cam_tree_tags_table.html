<!-- Tree TAGs shell; JavaScript builds its headings and rows from public JSON. -->
<section class="cam-table cam-table--tree-tags" data-cam-table data-source="{{ '/data/cam_tree_tags.json' | relative_url }}">
  <!-- Print and CSV actions use all currently filtered records. -->
  <div class="cam-table__controls">
    <label>
      Search all tree tags
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <button type="button" data-cam-table-print>Print filtered tags</button>
    <button type="button" data-cam-table-csv>Export as CSV</button>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <!-- Shared sticky-column behavior freezes View Record, TAG-ID, and Created By. -->
  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">Tree TAGs</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <nav class="cam-table__pagination" aria-label="Tree TAGs table pages" data-cam-table-pagination></nav>

  <!-- Keys match public_cam_tree_tags. Dropdown and dialog choices are
       populated from the complete downloaded JSON dataset. -->
  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "csvFilename": "tree-tags.csv",
      "columns": [
        {"key":"tag_id","label":"TAG-ID","type":"text"},
        {"key":"created_by","label":"Created By","type":"text","filter":"multi"},
        {"key":"date_tag_created","label":"Date Created","type":"date"},
        {"key":"mother_tree","label":"Mother Tree","type":"text","filter":"dialog-multi"},
        {"key":"mother_tree_other","label":"Mother Tree (Other)","type":"text"},
        {"key":"father_tree","label":"Father Tree","type":"text","filter":"dialog-multi"},
        {"key":"father_tree_other","label":"Father Tree (Other)","type":"text"},
        {"key":"parent_tree_note","label":"Parent Tree Note","type":"text"}
      ]
    }
  </script>
</section>

<!-- Shared table assets; query values prevent stale browser caches. -->
<link rel="stylesheet" href="{{ '/assets/css/cam-tables.css' | relative_url }}?v=20261114-tree-tags-1">
<script defer src="{{ '/assets/js/cam-tables.js' | relative_url }}?v=20261107-tag-id-1"></script>
