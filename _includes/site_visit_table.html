<!-- Site Visit shell; JavaScript builds the table from public JSON. -->
<section class="cam-table" data-cam-table data-source="{{ '/data/site_visit.json' | relative_url }}">
  <!-- Search, print, and CSV actions use the complete filtered result set. -->
  <div class="cam-table__controls">
    <label>
      Search all site-visit records
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <button type="button" data-cam-table-print>Print filtered site-visit records</button>
    <button type="button" data-cam-table-csv>Export as CSV</button>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <!-- Scrollable region for the generated headings and data rows. -->
  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">Site Visit records</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Pagination controls are inserted here only when needed. -->
  <nav class="cam-table__pagination" aria-label="Site Visit table pages" data-cam-table-pagination></nav>

  <!-- Settings consumed by cam-tables.js. Keep this block as valid JSON. -->
  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "csvFilename": "site-visits.csv",
      "columns": [
        {"key":"Site","label":"Site","type":"text"},
        {"key":"Tree ID","label":"Tree ID","type":"text"},
        {"key":"Date Planted","label":"Date Planted","type":"date"},
        {"key":"Health","label":"Health","type":"text"},
        {"key":"Access Path","label":"Access Path","type":"text"},
        {"key":"Access Level","label":"Access Level","type":"text"},
        {"key":"GPS Locked","label":"GPS Locked","type":"boolean"},
        {"key":"Planting Method","label":"Planting Method","type":"text"},
        {"key":"Wire Fence","label":"Wire Fence","type":"boolean"},
        {"key":"Mother Tree","label":"Mother Tree","type":"text"},
        {"key":"Father Tree","label":"Father Tree","type":"text"},
        {"key":"Parent Tree Note","label":"Parent Tree Note","type":"text"},
        {"key":"Note","label":"Note","type":"text"}
      ]
    }
  </script>
</section>

<!-- Shared table assets; the query value prevents stale browser caches. -->
<link rel="stylesheet" href="{{ '/assets/css/cam-tables.css' | relative_url }}?v=20260829-location-27">
<script defer src="{{ '/assets/js/cam-tables.js' | relative_url }}?v=20260829-location-27"></script>
