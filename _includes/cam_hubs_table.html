<!-- CAM Hubs shell; JavaScript builds the table from public JSON. -->
<section class="cam-table" data-cam-table data-source="{{ '/data/cam_hubs.json' | relative_url }}">
  <!-- Search, print, and CSV actions use the complete filtered result set. -->
  <div class="cam-table__controls">
    <label>
      Search all hubs
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <button type="button" data-cam-table-print>Print filtered hubs</button>
    <button type="button" data-cam-table-csv>Export as CSV</button>
    <button type="button" data-cam-table-map>Map filtered hubs</button>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <!-- Scrollable region for the generated headings and data rows. -->
  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">CAM Hubs</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Pagination controls are inserted here only when needed. -->
  <nav class="cam-table__pagination" aria-label="CAM hubs table pages" data-cam-table-pagination></nav>

  <!-- Settings consumed by cam-tables.js. Hub records are always labeled
       triangles; Hub Areas toggles boundary outlines and starts enabled. -->
  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "csvFilename": "cam-hubs.csv",
      "map": {
        "singular": "hub",
        "plural": "hubs",
        "recordMarkerType": "hubTriangle",
        "overlays": [
          {"label":"Hub Areas","url":"{{ '/data/hub-areas.geojson' | relative_url }}?v=20260901-nonoverlap-3","showByDefault":true,"featureTypes":["boundary"]}
        ],
        "popupTitleKey": "hub",
        "popupFields": [
          {"key":"captain","label":"Captain"},
          {"key":"lieutenant","label":"Lieutenant"}
        ]
      },
      "columns": [
        {"key":"hub","label":"Hub","type":"text"},
        {"key":"captain","label":"Captain","type":"text"},
        {"key":"lieutenant","label":"Lieutenant","type":"text"},
        {"key":"longitude","label":"Longitude","type":"number"},
        {"key":"latitude","label":"Latitude","type":"number"}
      ]
    }
  </script>
</section>

<!-- Leaflet supplies the interactive map; each integrity value must match. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<!-- Shared table assets; the query value prevents stale browser caches. -->
<link rel="stylesheet" href="{{ '/assets/css/cam-tables.css' | relative_url }}?v=20260829-location-27">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script defer src="{{ '/assets/js/cam-tables.js' | relative_url }}?v=20260829-location-27"></script>
