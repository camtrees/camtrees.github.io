<!-- CAM Sites shell; JavaScript builds its headings and rows from public JSON. -->
<section class="cam-table" data-cam-table data-source="{{ '/data/cam_sites.json' | relative_url }}">
  <!-- These controls act on all filtered records, not only the visible page. -->
  <div class="cam-table__controls">
    <label>
      Search all sites
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <button type="button" data-cam-table-print>Print filtered sites</button>
    <button type="button" data-cam-table-csv>Export as CSV</button>
    <button type="button" data-cam-table-map>Map filtered sites</button>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <!-- Scrollable region for the generated table and its sticky headings. -->
  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">CAM Sites</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- JavaScript adds Previous and Next buttons here when needed. -->
  <nav class="cam-table__pagination" aria-label="CAM sites table pages" data-cam-table-pagination></nav>

  <!-- Settings consumed by cam-tables.js. Keep this block as valid JSON. -->
  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "csvFilename": "cam-sites.csv",
      "map": {
        "singular": "site",
        "plural": "sites",
        "overlays": [
          {"label":"Hub Areas","url":"{{ '/data/hub-areas.geojson' | relative_url }}"}
        ],
        "popupTitleKey": "site",
        "popupFields": [
          {"key":"org_code","label":"Organization Code"},
          {"key":"organization","label":"Organization"}
        ]
      },
      "columns": [
        {"key":"site","label":"Site","type":"text"},
        {"key":"org_code","label":"Organization Code","type":"text"},
        {"key":"organization","label":"Organization","type":"text"},
        {"key":"site_url","label":"Website","type":"url","linkLabel":"Visit Website"},
        {"key":"town","label":"Town","type":"text"},
        {"key":"site_location","label":"Site Location","type":"text"},
        {"key":"location_note","label":"Location Note","type":"text"},
        {"key":"contact","label":"Contact","type":"text"},
        {"key":"primary_caretaker","label":"Primary Caretaker","type":"text"},
        {"key":"secondary_caretaker","label":"Secondary Caretaker","type":"text"},
        {"key":"longitude","label":"Longitude","type":"number"},
        {"key":"latitude","label":"Latitude","type":"number"}
      ]
    }
  </script>
</section>

<!-- Leaflet supplies the map; each integrity value must match its file version. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<!-- Shared table assets; the query value prevents stale browser caches. -->
<link rel="stylesheet" href="{{ '/assets/css/cam-tables.css' | relative_url }}?v=20260828-hublabels-23">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script defer src="{{ '/assets/js/cam-tables.js' | relative_url }}?v=20260828-hublabels-23"></script>
