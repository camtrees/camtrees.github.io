<section class="cam-table" data-cam-table data-source="{{ '/data/cam_sites.json' | relative_url }}">
  <div class="cam-table__controls">
    <label>
      Search all sites
      <input type="search" autocomplete="off" data-cam-table-search>
    </label>
    <p aria-live="polite" data-cam-table-summary></p>
  </div>

  <div class="cam-table__scroll" tabindex="0">
    <table data-cam-table-table>
      <caption class="sr-only">CAM Sites</caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <nav class="cam-table__pagination" aria-label="CAM sites table pages" data-cam-table-pagination></nav>

  <script type="application/json" data-cam-table-config>
    {
      "pageSize": 1000,
      "columns": [
        {"key":"site","label":"Site","type":"text"},
        {"key":"org_code","label":"Organization Code","type":"text"},
        {"key":"organization","label":"Organization","type":"text"},
        {"key":"town","label":"Town","type":"text"},
        {"key":"site_location","label":"Site Location","type":"text"},
        {"key":"location_note","label":"Location Note","type":"text"},
        {"key":"contact","label":"Contact","type":"text"},
        {"key":"primary_caretaker","label":"Primary Caretaker","type":"text"},
        {"key":"secondary_caretaker","label":"Secondary Caretaker","type":"text"}
      ]
    }
  </script>
</section>

<link rel="stylesheet" href="{{ '/assets/css/cam-tables.css' | relative_url }}">
<script defer src="{{ '/assets/js/cam-tables.js' | relative_url }}"></script>
