name: Export public CAM data

on:
  schedule:
    # Nightly at 03:20 UTC.
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent simultaneous Pages deployments while allowing a deployment already
# in progress to finish safely.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    # Scheduled workflows only run from the default branch.  This also prevents
    # an untrusted pull request from receiving the repository secret.
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-export.txt

      - name: Install exporter dependencies
        run: pip install -r scripts/requirements-export.txt

      - name: Export public data
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/export_public_data.py

      - name: Commit refreshed public data
        run: |
          # Keep this list synchronized with the outputs in export_public_data.py.
          if git diff --quiet -- data/cam_trees.json data/cam_sites.json data/cam_orgs.json data/cam_hubs.json data/site_visit.json data/parent_trees.json data/sites_hubs.json; then
            echo "No public data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cam_trees.json data/cam_sites.json data/cam_orgs.json data/cam_hubs.json data/site_visit.json data/parent_trees.json data/sites_hubs.json
          git commit -m "chore: refresh public CAM data"
          git push

      # A push made with GITHUB_TOKEN does not trigger another workflow. Build
      # the refreshed Jekyll site here so the new JSON reaches GitHub Pages.
      # Just the Docs is not bundled with jekyll-build-pages, so install the
      # repository's Gemfile dependencies before running Jekyll directly.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll and the Just the Docs theme
        run: |
          # Prefer the repository's pinned dependencies when it has a Gemfile.
          # The fallback keeps this workflow usable for a minimal site that
          # declares `theme: just-the-docs` without committing a Gemfile.
          if [[ -f Gemfile ]]; then
            bundle install
          else
            gem install jekyll -v "~> 4.4.1" --no-document
            gem install just-the-docs -v "0.12.0" --no-document
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the Jekyll site
        run: |
          if [[ -f Gemfile ]]; then
            bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          fi
        env:
          JEKYLL_ENV: production

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy refreshed data to GitHub Pages
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
