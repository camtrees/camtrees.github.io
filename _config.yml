title: CAMTREES Database
description: Everything volunteers and database admins need to know about the CAMTREES Database.

theme: just-the-docs
# remote_theme: just-the-docs/just-the-docs

# Set the favicon location - not necessary for modern browsers
# favicon_ico: "./assets/images/website/favicon-256x256.png"

# Our GitHub Pages repository
url: https://camtrees.github.io

# Public endpoint that receives New Site requests. Paste the deployed Google
# Apps Script web-app URL here after its permissions have been configured.
# This URL identifies the endpoint; it is not a password or secret credential.
google_apps_script_web_app_url: "https://script.google.com/macros/s/AKfycbzCAhZUW1zw7CsWDRXxtd-HmJlK8BHc5_3TIOW2jzz1I5wCPWzLLpTKB4ZIAgYrxPyOzA/exec"

# We don't want any auxiliary links shown at the top right on all pages
# aux_links:
#   Template Repository: https://github.com/just-the-docs/just-the-docs-template

# Open external links in new tabs
nav_external_links_new_tab: true

# Colors defined for various callout enclosures
callouts:
  note:
    title: Note
    color: green
  caution:
    title: Caution
    color: yellow
  warning:
    title: Warning
    color: red

# Provide a Copy button in code blocks
enable_copy_code_button: true

# Allow the use of mermaid files
mermaid:
  # Version of mermaid library
  # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
  version: "11.16.1"
