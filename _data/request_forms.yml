# Definitions used by the reusable data-request form include. To add another
# request type, copy this structure under a new key and reference that key from
# a short Markdown page in new-data-requests/.
new_site:
  request_type: new_site
  submit_label: Submit Site Request
  sections:
    - legend: Proposed Site...
      fields:
        - name: site_name
          label: Site Name
          type: text
          maxlength: 200
          required: true
          placeholder: Name of the new site
        - name: hub
          label: Hub
          type: text
          maxlength: 200
          required: true
          placeholder: Hub within which the new site resides
        - name: organization_code
          label: Organization Code
          type: text
          maxlength: 100
          required: true
          placeholder: CAM Org code under which the new site will fall under
        - name: organization_name
          label: Organization Name
          type: text
          maxlength: 200
          required: true
          placeholder: CAM Org name under which the new site will fall under
        - name: town
          label: Town
          type: text
          maxlength: 200
          required: true
          placeholder: Town where the new site is located
        - name: site_location
          label: Site Location
          type: text
          maxlength: 500
          placeholder: Street address or a brief location description
        - name: location_note
          label: Location Note
          type: text
          maxlength: 1000
          placeholder: Directions or details that would help identify the site
        - name: contact_name
          label: Contact Name
          type: text
          maxlength: 200
          required: true
          placeholder: Name of the site contact person
        - name: contact_email
          label: Contact Email
          type: email
          maxlength: 320
          required: true
          placeholder: Email address of the sote contact person
        - name: site_url
          label: Site URL
          type: url
          maxlength: 500
          placeholder: Web address of the site
        - name: primary_caretaker_name
          label: Primary Caretaker Name
          type: text
          maxlength: 200
          placeholder: Name of the primary caretaker of the trees at the site
        - name: primary_caretaker_email
          label: Primary Caretaker Email
          type: email
          maxlength: 320
          placeholder: Email address of the primary caretaker of the trees at the site
        - name: secondary_caretaker_name
          label: Secondary Caretaker Name
          type: text
          maxlength: 200
          placeholder: Name of the secondary caretaker of the trees at the site
        - name: secondary_caretaker_email
          label: Secondary Caretaker Email
          type: email
          maxlength: 320
          placeholder: Email address of the secondary caretaker of the trees at the site
    - legend: Requested By...
      fields:
        - name: name
          label: Requestor's Name
          type: text
          maxlength: 200
          required: true
          autocomplete: text
          placeholder: Your name
        - name: email
          label: Requestor's Email
          type: email
          maxlength: 320
          required: true
          autocomplete: email
          placeholder: Your email address
        - name: phone
          label: Requestor's Phone
          type: tel
          maxlength: 100
          autocomplete: tel
          placeholder: Your phone number
        - name: comments
          label: Additional Comments
          type: text
          maxlength: 1000
