# Definitions used by the reusable data-request form include. To add another
# request type, copy this structure under a new key and reference that key from
# a short Markdown page in new-data-requests/.
new_site:
  request_type: new_site
  submit_label: Submit Site Request
  sections:
    - legend: Proposed Site...
      fields:
        - name: site_name
          label: Site Name
          type: text
          maxlength: 200
          required: true
        - name: hub
          label: Hub
          type: text
          maxlength: 200
          required: true
        - name: organization_code
          label: Organization Code
          type: text
          maxlength: 100
          required: true
        - name: organization_name
          label: Organization Name
          type: text
          maxlength: 200
          required: true
        - name: town
          label: Town
          type: text
          maxlength: 200
          required: true
        - name: site_location
          label: Site Location
          type: text
          maxlength: 500
          placeholder: Street address or a brief location description
        - name: location_note
          label: Location Note
          type: text
          maxlength: 1000
          placeholder: Directions or details that would help identify the site
        - name: contact_name
          label: Contact Name
          type: text
          maxlength: 200
          required: true
        - name: contact_email
          label: Contact Email
          type: email
          maxlength: 320
          required: true
        - name: site_url
          label: Site URL
          type: url
          maxlength: 500
        - name: primary_caretaker_name
          label: Primary Caretaker Name
          type: text
          maxlength: 200
        - name: primary_caretaker_email
          label: Primary Caretaker Email
          type: email
          maxlength: 320
        - name: secondary_caretaker_name
          label: Secondary Caretaker Name
          type: text
          maxlength: 200
        - name: secondary_caretaker_email
          label: Secondary Caretaker Email
          type: email
          maxlength: 320
    - legend: Requested By...
      fields:
        - name: name
          label: Name
          type: text
          maxlength: 200
          required: true
          autocomplete: text
        - name: email
          label: Email
          type: email
          maxlength: 320
          required: true
          autocomplete: email
        - name: phone
          label: Phone
          type: tel
          maxlength: 100
          autocomplete: tel
        - name: comments
          label: Additional Comments
          type: text
          maxlength: 1000
